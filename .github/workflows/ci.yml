name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks-action v2 scans every pushed commit
      # (first-commit^..head); a depth-1 clone lacks the base and the
      # scan fails with "unknown revision".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Both suites are Groq-free by design (ADR-0002): the eval harness
      # never runs here — it costs real LLM calls and runs locally.
      - name: 5gcap tests
        working-directory: 5gcap
        run: uv sync && uv run pytest tests/
      - name: triage tests
        working-directory: triage
        run: uv sync && uv run pytest tests/
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
