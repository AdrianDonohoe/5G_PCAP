services:
  mongo:
    image: mongo:6.0
    container_name: sandbox_mongo
    command: --bind_ip 0.0.0.0
    env_file:
      - .env
    volumes:
      - mongodbdata:/data/db
      - mongodbdata:/data/configdb
    networks:
      sandbox_core:
        ipv4_address: ${MONGO_IP}

  nrf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: sandbox_nrf
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=nrf
    volumes:
      - ./nrf:/mnt/nrf
      - ./log:/open5gs/install/var/log/open5gs
    networks:
      sandbox_core:
        ipv4_address: ${NRF_IP}

  scp:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: sandbox_scp
    depends_on:
      - nrf
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=scp
    volumes:
      - ./scp:/mnt/scp
      - ./log:/open5gs/install/var/log/open5gs
    networks:
      sandbox_core:
        ipv4_address: ${SCP_IP}

  ausf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: sandbox_ausf
    depends_on:
      - nrf
      - scp
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=ausf
    volumes:
      - ./ausf:/mnt/ausf
      - ./log:/open5gs/install/var/log/open5gs
    networks:
      sandbox_core:
        ipv4_address: ${AUSF_IP}

  udr:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: sandbox_udr
    depends_on:
      - nrf
      - scp
      - mongo
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=udr
      - DB_URI=mongodb://${MONGO_IP}/open5gs
    volumes:
      - ./udr:/mnt/udr
      - ./log:/open5gs/install/var/log/open5gs
    networks:
      sandbox_core:
        ipv4_address: ${UDR_IP}

  udm:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: sandbox_udm
    depends_on:
      - nrf
      - scp
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=udm
    volumes:
      - ./udm:/mnt/udm
      - ./log:/open5gs/install/var/log/open5gs
    networks:
      sandbox_core:
        ipv4_address: ${UDM_IP}

  pcf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: sandbox_pcf
    depends_on:
      - nrf
      - scp
      - mongo
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=pcf
      - DB_URI=mongodb://${MONGO_IP}/open5gs
    volumes:
      - ./pcf:/mnt/pcf
      - ./log:/open5gs/install/var/log/open5gs
    networks:
      sandbox_core:
        ipv4_address: ${PCF_IP}

  bsf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: sandbox_bsf
    depends_on:
      - nrf
      - scp
      - mongo
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=bsf
      - DB_URI=mongodb://${MONGO_IP}/open5gs
    volumes:
      - ./bsf:/mnt/bsf
      - ./log:/open5gs/install/var/log/open5gs
    networks:
      sandbox_core:
        ipv4_address: ${BSF_IP}

  nssf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: sandbox_nssf
    depends_on:
      - nrf
      - scp
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=nssf
    volumes:
      - ./nssf:/mnt/nssf
      - ./log:/open5gs/install/var/log/open5gs
    networks:
      sandbox_core:
        ipv4_address: ${NSSF_IP}

  amf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: sandbox_amf
    depends_on:
      - nrf
      - scp
      - ausf
      - udm
      - udr
      - pcf
      - bsf
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=amf
    volumes:
      - ./amf:/mnt/amf
      - ./log:/open5gs/install/var/log/open5gs
    networks:
      sandbox_core:
        ipv4_address: ${AMF_IP}

  smf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: sandbox_smf
    depends_on:
      - nrf
      - scp
      - amf
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=smf
    volumes:
      - ./smf:/mnt/smf
      - ./log:/open5gs/install/var/log/open5gs
    networks:
      sandbox_core:
        ipv4_address: ${SMF_IP}

  upf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: sandbox_upf
    depends_on:
      - nrf
      - scp
      - smf
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=upf
    volumes:
      - ./upf:/mnt/upf
      - ./log:/open5gs/install/var/log/open5gs
    cap_add:
      - NET_ADMIN
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      sandbox_core:
        ipv4_address: ${UPF_IP}

networks:
  sandbox_core:
    name: sandbox_core
    ipam:
      config:
        - subnet: ${CORE_SUBNET}

volumes:
  mongodbdata:
    name: sandbox_core_mongodbdata
